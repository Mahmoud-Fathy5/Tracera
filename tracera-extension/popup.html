<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tracera</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 320px;
            font-family: 'Segoe UI', -apple-system, BlinkMacSystemFont, sans-serif;
            background: linear-gradient(160deg, #0a1518 0%, #0f1f21 50%, #0a1518 100%);
            color: #e0f2f1;
            overflow-x: hidden;
        }

        /* Header */
        .header {
            padding: 24px 20px 18px;
            text-align: center;
            border-bottom: 1px solid rgba(0, 229, 204, 0.1);
        }

        .header__brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 6px;
        }

        .header__logo {
            width: 30px;
            height: 30px;
            color: #00e5cc;
        }

        .header__name {
            font-size: 22px;
            font-weight: 700;
            color: #00e5cc;
            letter-spacing: 1px;
        }

        .header__sub {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            letter-spacing: 0.5px;
        }

        /* Status */
        .status {
            padding: 14px 20px;
        }

        .status__card {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.06);
            border-radius: 12px;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status__dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: #555;
            flex-shrink: 0;
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }

        .status__dot--ok {
            background: #00e596;
            box-shadow: 0 0 8px rgba(0, 229, 150, 0.4);
        }

        .status__dot--error {
            background: #ff4d4d;
            box-shadow: 0 0 8px rgba(255, 77, 77, 0.4);
        }

        .status__dot--loading {
            background: #ffaa00;
            animation: pulse-dot 1.5s ease-in-out infinite;
        }

        @keyframes pulse-dot {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        .status__info {
            flex: 1;
        }

        .status__label {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.35);
            margin-bottom: 2px;
        }

        .status__value {
            font-size: 13px;
            font-weight: 500;
            color: #e0f2f1;
        }

        /* Instructions */
        .instructions {
            padding: 16px 20px;
        }

        .instructions__title {
            font-size: 11px;
            color: rgba(255, 255, 255, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 14px;
        }

        .instructions__step {
            display: flex;
            gap: 12px;
            margin-bottom: 14px;
        }

        .instructions__step:last-child {
            margin-bottom: 0;
        }

        .instructions__num {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: rgba(0, 229, 204, 0.1);
            color: #00e5cc;
            font-size: 11px;
            font-weight: 700;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-shrink: 0;
            margin-top: 1px;
        }

        .instructions__text {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.55;
        }

        .instructions__text strong {
            color: #e0f2f1;
            font-weight: 500;
        }

        .instructions__text .highlight {
            color: #00e5cc;
            font-weight: 500;
        }

        /* Divider */
        .divider {
            height: 1px;
            background: rgba(255, 255, 255, 0.04);
            margin: 0 20px;
        }

        /* Footer */
        .footer {
            padding: 14px 20px;
            text-align: center;
        }

        .footer__text {
            font-size: 10px;
            color: rgba(255, 255, 255, 0.18);
            letter-spacing: 0.3px;
        }
    </style>
</head>

<body>
    <!-- Header -->
    <div class="header">
        <div class="header__brand">
            <svg class="header__logo" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M12 2L3 7v10l9 5 9-5V7l-9-5z" stroke="currentColor" stroke-width="1.5" fill="none"/>
                <path d="M12 8a4 4 0 100 8 4 4 0 000-8z" stroke="currentColor" stroke-width="1.5"/>
                <line x1="4" y1="12" x2="20" y2="12" stroke="currentColor" stroke-width="1" opacity="0.5"/>
            </svg>
            <span class="header__name">Tracera</span>
        </div>
        <p class="header__sub">Digital Forensic Intelligence</p>
    </div>

    <!-- Server Status -->
    <div class="status">
        <div class="status__card">
            <div class="status__dot status__dot--loading" id="status-dot"></div>
            <div class="status__info">
                <div class="status__label">API Status</div>
                <div class="status__value" id="status-text">Checking…</div>
            </div>
        </div>
    </div>

    <div class="divider"></div>

    <!-- Instructions -->
    <div class="instructions">
        <h3 class="instructions__title">How to Use</h3>
        <div class="instructions__step">
            <span class="instructions__num">1</span>
            <p class="instructions__text"><strong>Right-click</strong> any image on any webpage</p>
        </div>
        <div class="instructions__step">
            <span class="instructions__num">2</span>
            <p class="instructions__text">Select <span class="highlight">"🔍 Analyze with Tracera"</span></p>
        </div>
        <div class="instructions__step">
            <span class="instructions__num">3</span>
            <p class="instructions__text">View the <strong>Real / Fake verdict</strong> with confidence score and model attribution</p>
        </div>
    </div>

    <!-- Footer -->
    <div class="footer">
        <p class="footer__text">Powered by GramNet v3 • Cairo University</p>
    </div>

    <script src="popup.js"></script>
</body>

</html>
